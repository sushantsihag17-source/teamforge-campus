<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="TeamForge — connect with builders, find projects and assemble your dream hackathon team using real algorithms.">
  <title>TeamForge — Build something extraordinary</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/light-theme.css">
  <link rel="stylesheet" href="/auth.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Site navigation">
      <a href="#overview" class="brand" data-nav="overview" aria-label="TeamForge home">
        <span class="brand-mark"><svg width="27" height="27" viewBox="0 0 24 24" fill="none"><path d="m5 18 6.5-12 3.3 5.8 4.2-2.5" stroke="currentColor" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="19" cy="9.3" r="2.2" fill="currentColor"/></svg></span>
        <span>team<span class="brand-bold">forge</span><small>BUILD TOGETHER.</small></span>
      </a>
      <nav id="main-nav" aria-label="Main navigation">
        <button class="nav-item active" data-nav="overview" type="button"><span data-icon="layout"></span>Home</button>
        <button class="nav-item" data-nav="discover" type="button"><span data-icon="users"></span>Find teammates</button>
        <button class="nav-item" data-nav="projects" type="button"><span data-icon="layers"></span>Explore projects</button>
        <button class="nav-item" data-nav="builder" type="button"><span data-icon="sparkles"></span>Build a team</button>
        <button class="nav-item" data-nav="activity" type="button"><span data-icon="activity"></span>My activity</button>
      </nav>
      <div class="nav-cta"><button class="btn btn-primary" type="button" data-action="new-project"><span data-icon="plus"></span>Post a project</button></div>
    </aside>
    <div class="main-column">
      <header class="topbar">
        <div class="topbar-left"><button class="icon-button mobile-menu" data-action="menu" aria-label="Toggle navigation"><span data-icon="menu"></span></button><div class="breadcrumb">Campus community <span>/</span> <strong id="current-breadcrumb">Home</strong></div></div>
        <div class="topbar-right"><div class="status-indicator"><i></i> Students online</div><button class="account-toggle" id="account-toggle" data-action="toggle-account" aria-haspopup="true" aria-expanded="false"><span id="header-avatar"></span><span class="account-label" id="header-name">Loading...</span><span data-icon="chevron-down"></span></button></div>
        <div class="account-menu hidden" id="account-menu"></div>
      </header>
      <main id="view" tabindex="-1"><div class="loading-block"><div class="spinner"></div> Loading TeamForge...</div></main>
      <footer class="page-footer"><span>TeamForge · Students building things together</span><span>Student-built campus collaboration</span></footer>
    </div>
  </div>
  <div id="modal-root"></div>
  <div id="auth-screen"></div>
  <div id="toast-root" aria-live="polite"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="/auth.js" defer></script>
  <script src="/app.js" defer></script>
</body>
</html>
